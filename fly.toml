app = "mon-bot-discord-ipdlfw"
primary_region = "cdg"

[build]
builder = "paketobuildpacks/builder:base"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
