app = "mon-bot-discord-ipdlfw"
primary_region = "cdg"

[build]
builder = "paketobuildpacks/builder:base"

[env]
PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"


[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
