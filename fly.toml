# fly.toml app configuration file generated for mon-bot-discord-ipdlfw on 2026-06-05T11:19:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mon-bot-discord-ipdlfw'
primary_region = 'cdg'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  min_machines_running = 1
  ports = []

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
